name: Deploy to GitHub Pages

on:
  # 推送到 main 就重新构建发布；也可以在 Actions 页面手动触发
  push:
    branches: [main]
  workflow_dispatch:

# 允许 job 克隆仓库并创建 Pages 部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署，排队而不是互相取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        # with:
        #   node-version: 24   # 默认就是 24，需要固定版本时再打开

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
